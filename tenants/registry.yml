# =============================================================================
# TENANT REGISTRY — pre-built demonstration tenants
# =============================================================================
#
# Every tenant here is FICTIONAL and its corpus is FULLY SYNTHETIC. No client
# name, document, or dataset appears anywhere in this repository.
#
# The domain shapes — which documents exist, what they are called, which
# identifiers thread through them, which regulations bite — are drawn from
# public standards and regulator sources. That is what makes these read as real
# to a practitioner while remaining safe to publish, screenshot, and hand out.
#
# Why pre-build them: the demo has to exist before the prospect does. Waiting
# for a name and a sample dataset costs days that a live pipeline does not have.
# Each of these can be shown as-is, or cloned and re-badged in minutes once the
# prospect's real name and data arrive.
#
# THE SUBTYPE RULE. Two tenants in the "same industry" are deliberately
# separate builds — Q-Health (provider/EMR) and Q-Assure Claims (payer) share an
# industry label and almost nothing else: different documents, different codes,
# different systems, different regulators, different questions. Reusing one
# configuration for the other is precisely the failure that made a build for one
# airline non-transferable to the next. Subtype, not industry, is the unit of
# reuse.

version: 1

defaults:
  builder:
    name: QualiZeal
    unit: AI Center of Excellence
    unit_short: AI-CoE
  stage: Demonstration
  corpus_target: 60          # documents generated per tenant
  seed: 20260803             # fixed so every rebuild is byte-identical

