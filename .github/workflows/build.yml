name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- stage 1
  # Corpora and safety gates. Runs once. Everything downstream depends on it,
  # so a real-world name or a PII pattern stops the whole pipeline here rather
  # than being discovered after publication.
  corpora:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }

      - run: pip install -r pipeline/requirements.txt && pip install pytest

      - name: Generate all tenant corpora
        run: python -m pipeline.build_tenants

      - name: Safety gate — no real-world names, no PII
        run: pytest tests/test_tenants.py -q -k "real_world or pii or synthetic"

      - name: Full tenant factory tests
        run: pytest tests/ -q

      - uses: actions/upload-artifact@v4
        with:
          name: corpora
          path: tenants/
          retention-days: 1

  # ---------------------------------------------------------------- stage 2
  # Assemble and publish. This reads the corpora artefact directly: build_site
  # produces site/demo/ and site/data/ from tenants/, so there is no per-tenant
  # index build between the two.
  #
  # There used to be one — a `fabric` matrix job running pipeline.build_index
  # and pipeline.train_intent into site/t/<slug>/. It was removed because it
  # fed nothing: site/t/ is a superseded route (build_site's own docstring says
  # so), nothing links to it, and all eleven site/t/<slug>/index.html files are
  # byte-identical copies of a stale landing page whose relative links are
  # broken. build_index cannot run in any case — it imports four names from
  # pipeline.textnorm that the module does not define.
  publish:
    needs: corpora
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r pipeline/requirements.txt

      - uses: actions/download-artifact@v4
        with: { name: corpora, path: tenants/ }

      - name: Build the site
        run: python -m pipeline.build_site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
